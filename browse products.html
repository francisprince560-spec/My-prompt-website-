     <style>
    :root { --bg:#0b1020; --card:#121a33; --text:#eaf0ff; --muted:#b8c2ff; --accent:#7c5cff; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(1200px 600px at 20% 0%, #1b2a6b 0%, var(--bg) 55%);color:var(--text)}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1120px;margin:0 auto;padding:20px}
    header{position:sticky;top:0;backdrop-filter:blur(10px);background:rgba(11,16,32,.62);border-bottom:1px solid rgba(255,255,255,.08);z-index:10}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px}
    .logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#28d7ff)}
    .links{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);cursor:pointer}
    .btn.primary{background:linear-gradient(135deg,var(--accent),#28d7ff);border:0;color:#06101a;font-weight:900}
    .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:inline-block}
    .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding:34px 0}
    .h1{font-size:44px;line-height:1.05;margin:12px 0 10px}
    .p{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 18px}
    .panel{border:1px solid rgba(255,255,255,.10);background:rgba(18,26,51,.7);border-radius:22px;padding:18px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .card{border:1px solid rgba(255,255,255,.10);background:rgba(18,26,51,.6);border-radius:18px;padding:16px}
    .card h3{margin:0 0 6px}
    .card p{margin:1;color:var(--muted);line-height:1}
    .section{padding:26px 0}
    .section h2{margin:0 0 10px;font-size:26px}
    .products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .prod{display:flex;flex-direction:table;gap:20px}
    .prod img{width:200%;height:370px;object-fit:cover;border-radius:14px;border:1px solid rgba(255,255,255,.10)}
    .price{font-weight:900}
    .pill{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:var(--muted)}
    .row{display:flex;gap:10px;flex-wrap:unset;align-items:start}
    footer{padding:26px 0;color:var(--muted);border-top:1px solid rgba(255,255,255,.08)}
    @media (max-width:980px){ .hero{grid-template-columns:1fr} .grid,.products{grid-template-columns:1fr} .h1{font-size:36px} }
    input{outline:none}
  </style>
